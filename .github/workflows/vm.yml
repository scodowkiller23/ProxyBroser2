name: Máquina Oracle

on:
  workflow_dispatch:
    inputs:
      comando:
        description: "Qué ejecutar en la máquina"
        default: "estado"
        type: choice
        options: [estado, desplegar, logs, desplegar-n8n, logs-n8n]

concurrency: vm

env:
  VM: ubuntu@143.47.39.212

jobs:
  vm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Conectar
        env:
          KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 15 143.47.39.212 >> ~/.ssh/known_hosts
      - name: Ejecutar
        env:
          ADMIN_PASSWORD: ${{ secrets.PP_ADMIN_PASSWORD }}
          DOMAIN: ${{ vars.PP_DOMAIN || 'proxypinga.duckdns.org' }}
          N8N_DOMAIN: ${{ vars.N8N_DOMAIN || 'n8n.canalyoutube.duckdns.org' }}
          # Claves opcionales que leen los workflows de n8n con $env.*; las que no estén definidas no se escriben.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKER_SHARED_SECRET: ${{ secrets.WORKER_SHARED_SECRET }}
          YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID || 'UC2rvSr6a5v8EenO9E7gR5nw' }}
          GITHUB_REPO: ${{ vars.CANAL_REPO || 'scodowkiller23/CanalYoutube' }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
          CLAUDE_MODEL_FAST: ${{ vars.CLAUDE_MODEL_FAST || 'claude-haiku-5-5' }}
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: |
          set -o pipefail
          case "${{ inputs.comando }}" in
            desplegar)
              rsync -az --delete --exclude data --exclude .env --exclude node_modules --exclude web/dist \
                proxypinga/ "$VM:proxypinga/"
              printf 'DOMAIN=%s\nADMIN_PASSWORD=%s\nN8N_DOMAIN=%s\n' "$DOMAIN" "$ADMIN_PASSWORD" "$N8N_DOMAIN" | ssh "$VM" 'umask 077; cat > proxypinga/.env'
              ssh "$VM" 'bash proxypinga/deploy.sh' 2>&1 | tee salida.txt
              ;;
            desplegar-n8n)
              # Sube n8n + Postgres (canal/) y recrea solo el Caddy del proxy para que sirva el dominio de n8n.
              rsync -az --exclude .env --exclude app.env --exclude backups canal/ "$VM:canal/"
              rsync -az --delete --exclude data --exclude .env --exclude node_modules --exclude web/dist \
                proxypinga/ "$VM:proxypinga/"
              printf 'DOMAIN=%s\nADMIN_PASSWORD=%s\nN8N_DOMAIN=%s\n' "$DOMAIN" "$ADMIN_PASSWORD" "$N8N_DOMAIN" | ssh "$VM" 'umask 077; cat > proxypinga/.env'
              for k in ANTHROPIC_API_KEY YOUTUBE_API_KEY TELEGRAM_CHAT_ID WORKER_SHARED_SECRET YOUTUBE_CHANNEL_ID GITHUB_REPO CLAUDE_MODEL CLAUDE_MODEL_FAST WORKER_URL; do
                if [ -n "${!k}" ]; then printf '%s=%s\n' "$k" "${!k}"; fi
              done > app.env
              ssh "$VM" 'umask 077; cat > canal/app.env' < app.env
              rm -f app.env
              ssh "$VM" "N8N_DOMAIN=$N8N_DOMAIN bash canal/deploy.sh && cd proxypinga && docker compose up -d --no-deps --force-recreate caddy && sleep 3 && docker compose logs --tail 10 caddy" 2>&1 | tee salida.txt
              ;;
            logs-n8n)
              ssh "$VM" 'cd canal && docker compose ps && docker compose logs --tail 40' 2>&1 | tee salida.txt
              ;;
            logs)
              ssh "$VM" 'cd proxypinga && docker compose ps && docker compose logs --tail 40' 2>&1 | tee salida.txt
              ;;
            *)
              ssh "$VM" 'bash -s' < deploy/estado.sh 2>&1 | tee salida.txt
              ;;
          esac
      - name: Resumen
        if: always()
        run: |
          [ -f salida.txt ] || exit 0
          grep -v -i 'password' salida.txt | tail -n 45 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}' | sed 's/^/::notice title=salida::/'
          echo

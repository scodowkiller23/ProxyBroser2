name: Máquina Oracle

on:
  workflow_dispatch:
    inputs:
      comando:
        description: "Qué ejecutar en la máquina"
        default: "estado"
        type: choice
        options: [estado, desplegar, logs]

concurrency: vm

env:
  VM: ubuntu@143.47.39.212

jobs:
  vm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Conectar
        env:
          KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 15 143.47.39.212 >> ~/.ssh/known_hosts
      - name: Ejecutar
        env:
          ADMIN_PASSWORD: ${{ secrets.PP_ADMIN_PASSWORD }}
          DOMAIN: ${{ vars.PP_DOMAIN || 'proxypinga.duckdns.org' }}
        run: |
          set -o pipefail
          case "${{ inputs.comando }}" in
            desplegar)
              rsync -az --delete --exclude data --exclude .env --exclude node_modules --exclude web/dist \
                proxypinga/ "$VM:proxypinga/"
              printf 'DOMAIN=%s\nADMIN_PASSWORD=%s\n' "$DOMAIN" "$ADMIN_PASSWORD" | ssh "$VM" 'umask 077; cat > proxypinga/.env'
              ssh "$VM" 'bash proxypinga/deploy.sh' 2>&1 | tee salida.txt
              ;;
            logs)
              ssh "$VM" 'cd proxypinga && docker compose ps && docker compose logs --tail 40' 2>&1 | tee salida.txt
              ;;
            *)
              ssh "$VM" 'bash -s' < deploy/estado.sh 2>&1 | tee salida.txt
              ;;
          esac
      - name: Resumen
        if: always()
        run: |
          [ -f salida.txt ] || exit 0
          grep -v -i 'password' salida.txt | tail -n 45 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}' | sed 's/^/::notice title=salida::/'
          echo

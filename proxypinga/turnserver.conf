# Servidor TURN para que WebRTC (Haxball y compañía) conecte cuando los dos
# jugadores no se ven directamente. El secreto y el dominio llegan por la linea
# de ordenes desde docker-compose.
listening-port=3478
fingerprint
use-auth-secret
no-cli
no-tlsv1
no-tlsv1_1
stale-nonce=600

# Puertos por los que viaja el trafico del juego. Tienen que estar abiertos en Oracle.
min-port=49160
max-port=49200

# Limites para que esto no se convierta en un repetidor publico.
total-quota=120
user-quota=12

# El TURN no puede servir de puente hacia la red interna de la maquina.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

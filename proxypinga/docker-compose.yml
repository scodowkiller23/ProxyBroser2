services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data

  # TURN: repetidor de WebRTC para que Haxball y similares conecten con gente de fuera.
  turn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --realm=${DOMAIN}
      - --static-auth-secret=${TURN_SECRET}
      # Sin esto coturn ofrece tambien las redes internas de Docker, que no sirven de nada.
      - --listening-ip=${TURN_PRIVATE_IP:-10.0.0.29}
      - --relay-ip=${TURN_PRIVATE_IP:-10.0.0.29}
      - --external-ip=${TURN_PUBLIC_IP:-143.47.39.212}/${TURN_PRIVATE_IP:-10.0.0.29}

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      N8N_DOMAIN: ${N8N_DOMAIN:-n8n.canalyoutube.duckdns.org}
    networks: [default, web]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:

# Red compartida con n8n (../canal) para que Caddy le pase el tráfico.
networks:
  web:
    external: true
